[project]
name = "core-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "upstream-shared",
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "pydantic==2.9.*",
  "pydantic-settings==2.6.*",
  "dbos==0.26.*",
  "psycopg[binary,pool]==3.2.*",
  "sqlalchemy==2.0.*",
  "alembic==1.14.*",
  "httpx==0.27.*",
  "anthropic>=1.0,<2",
  "pywebpush==2.0.*",
  "boto3==1.35.*",
  "duckdb==1.1.*",
  "pyarrow==17.*",
]

[dependency-groups]
dev = ["pytest==8.3.*", "pytest-asyncio==0.24.*", "ruff==0.7.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upstream_api"]
