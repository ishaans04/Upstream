[project]
name = "clinical-stats"
version = "0.1.0"
description = "Isolated health zone (GC-7): aggregate counts in, test results out."
requires-python = "==3.12.*"
dependencies = [
  "upstream-shared",
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "psycopg[binary,pool]==3.2.*",
  "sqlalchemy==2.0.*",
  "numpy==2.1.*",
  "scipy==1.14.*",
  "statsmodels==0.14.*",
  "httpx==0.27.*",
]

[dependency-groups]
dev = ["pytest==8.3.*", "pytest-asyncio==0.24.*", "ruff==0.7.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clinical_stats"]
