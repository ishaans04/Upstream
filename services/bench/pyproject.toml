[project]
name = "bench"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "upstream-shared",
  "kernel",
  "simulator",
  "numpy==2.1.*",
  "scipy==1.14.*",
  "pyarrow==17.*",
  "duckdb==1.1.*",
  "matplotlib==3.9.*",
]

[dependency-groups]
dev = ["pytest==8.3.*", "pytest-asyncio==0.24.*", "ruff==0.7.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmarks"]

[tool.uv.sources]
kernel = { workspace = true }
simulator = { workspace = true }
