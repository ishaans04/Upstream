[project]
name = "simulator"
version = "0.1.0"
description = "Scenario generator writing to the same event log (GC-10, stream='sim')."
requires-python = "==3.12.*"
dependencies = [
  "upstream-shared",
  "kernel",
  "numpy==2.1.*",
  "scipy==1.14.*",
  "numpyro==0.15.*",
  "psycopg[binary,pool]==3.2.*",
  "httpx==0.27.*",
]

[dependency-groups]
dev = ["pytest==8.3.*", "pytest-asyncio==0.24.*", "ruff==0.7.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upstream_sim"]

[tool.uv.sources]
kernel = { workspace = true }
