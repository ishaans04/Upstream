name: upstream
services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CLINICAL_DB_PASSWORD: ${CLINICAL_DB_PASSWORD}
      KERNEL_DB_PASSWORD: ${KERNEL_DB_PASSWORD}
      HAPI_DB_PASSWORD: ${HAPI_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: core-api } }
    command: uvicorn upstream_api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CATCHMENT_ID: ${CATCHMENT_ID}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HAPI_BASE_URL: ${HAPI_BASE_URL}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL}
    depends_on: { db: { condition: service_healthy } }
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]

  kernel:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: kernel } }
    command: python -m upstream_kernel.worker
    environment:
      # The worker uses KERNEL_DATABASE_URL and only that: kernel_role cannot read
      # sim_truth and cannot write episodes (GC-10, PRD 10.3).
      KERNEL_DATABASE_URL: ${KERNEL_DATABASE_URL}
      # The compile CLI is a build task that happens to ship in this image. It
      # populates the network tables, which kernel_role may only SELECT, so it
      # needs the app connection. Nothing in the worker path may use this.
      DATABASE_URL: ${DATABASE_URL}
      CATCHMENT_ID: ${CATCHMENT_ID}
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"                          # GC-6 determinism + numeric headroom
      XLA_FLAGS: "--xla_cpu_enable_fast_math=false"
    depends_on: { db: { condition: service_healthy } }
    volumes: ["./data:/app/data"]

  clinical:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: clinical-stats } }
    command: uvicorn clinical_stats.main:app --host 0.0.0.0 --port 8100
    environment:
      CLINICAL_DATABASE_URL: ${CLINICAL_DATABASE_URL}
      EPISODE_API_BASE_URL: http://api:8000
    depends_on: { db: { condition: service_healthy } }
    ports: ["8100:8100"]

  hapi:
    image: hapiproject/hapi:v7.4.0
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi_role
      SPRING_DATASOURCE_PASSWORD: ${HAPI_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      # The dialect goes through SPRING_APPLICATION_JSON, not
      # SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT.
      #
      # `spring.jpa.properties` is a Map, so everything after it is a map *key*.
      # Spring's relaxed binding turns the underscores in an environment
      # variable name into hyphens, so that variable sets the key
      # `hibernate-dialect`, which Hibernate ignores - and the starter's own
      # default of HapiFhirH2Dialect stands. Nothing fails loudly: H2Dialect
      # then tries to parse PostgreSQL's version string, dies on "(Ubuntu",
      # and HAPI carries on emitting H2 DDL (`clob`, `blob`) and H2 SQL
      # (`select next value for seq_resource_id`) against Postgres. Every write
      # fails with HAPI-2223 while the server still answers /metadata with 200.
      #
      # SPRING_APPLICATION_JSON is bound as structured JSON, so the key keeps
      # its dot, and it outranks the starter's application.yaml.
      SPRING_APPLICATION_JSON: >-
        {"spring":{"jpa":{"properties":{"hibernate":
        {"dialect":"ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect"}}}}}
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_VALIDATION_REQUESTS_ENABLED: "true"
      HAPI_FHIR_SUBSCRIPTION_RESTHOOK_ENABLED: "true"
      # No HAPI_FHIR_IMPLEMENTATIONGUIDES_* here, deliberately. Installing the
      # IG at boot makes HAPI's startup depend on resolving a package: the OAH
      # IG is not on any registry, and with only name and version bound HAPI
      # dies with "HAPI-1301: Unable to locate package" and never serves again.
      # It would also never load Upstream's own profiles, which is what
      # $validate actually needs. `make fhir-load` (fhir/scripts/load-into-hapi.sh)
      # pushes both once HAPI is up, and can be re-run at any time.
    depends_on: { db: { condition: service_healthy } }
    ports: ["8080:8080"]

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY}
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]

  web:
    # Built in Phase 10. Behind a profile until then so `make up` works.
    profiles: ["web"]
    build: { context: ./web, dockerfile: ../docker/Dockerfile.web }
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    depends_on: [api]
    ports: ["3000:3000"]

volumes: { pgdata: {}, miniodata: {} }
