# fhir/sushi-config.yaml
#
# Upstream's FHIR Implementation Guide. Every profile here derives from the
# OneAquaHealth IG (GC-2); nothing invents a parallel model.
#
# `hl7.eu.fhir.oah` is not published to packages.fhir.org, so it is vendored at
# vendor/hl7.eu.fhir.oah.tgz and installed into the local FHIR package cache by
# scripts/install-vendored-ig.sh before sushi runs. See that script for why.
id: upstream.onehealth
canonical: https://upstream-onehealth.example
name: UpstreamOneHealth
title: "Upstream - Exposure Episodes for One Health"
description: >-
  Upstream turns citizen, sensor and laboratory observations of a river
  catchment into probabilistic exposure episodes, and publishes those episodes
  as FHIR so that clinicians receive environmental context alongside a patient.
status: draft
version: 0.1.0
fhirVersion: 4.0.1
# copyrightYear, releaseLabel and show-inherited-invariants are deliberately
# absent. sushi turns each into an ImplementationGuide.definition.parameter,
# and none of those codes is in R4's required GuideParameterCode value set, so
# each one is a validator error - seven of them, against GC-3. They matter only
# to the HL7 IG Publisher, which this build does not run. sushi warns about the
# first two; that warning is the trade.
license: CC0-1.0
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#150 "Europe"
publisher:
  name: Upstream (IEEE OneAquaHealth Hackathon 2026)
dependencies:
  hl7.eu.fhir.oah: 0.1.0-ci-build
  hl7.fhir.uv.subscriptions-backport.r4: 1.1.0
# At least one parameter must be present: sushi emits `parameter: []` when
# there are none, and an empty array is itself a validator error. This one is
# both valid in R4's GuideParameterCode and true of this project.
parameters:
  path-pages: input/pagecontent
menu:
  Home: index.html
  Artifacts: artifacts.html
