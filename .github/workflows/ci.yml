name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: upstream
          POSTGRES_PASSWORD: upstream
          POSTGRES_DB: upstream
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U upstream" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://upstream:upstream@localhost:5432/upstream
      CATCHMENT_ID: coimbra-ribeira
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen

      # The GitHub service container starts from a bare image, so the
      # docker/postgres/init scripts never run. Apply the parts the tests need.
      - name: Bootstrap database extensions and roles
        run: |
          uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as c:
              for stmt in open("docker/postgres/init/00-extensions.sql").read().split(";"):
                  if stmt.strip():
                      try:
                          c.execute(stmt)
                      except psycopg.errors.DuplicateObject:
                          pass
                      except psycopg.errors.DuplicateDatabase:
                          pass
          PY

      - run: uv run ruff check .
      - run: uv run alembic -c db/alembic.ini upgrade head
      - run: uv run pytest -q
  # `fhir` job added in Phase 7; `bench` job added in Phase 9.
