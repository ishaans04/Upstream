name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: upstream
          POSTGRES_PASSWORD: upstream
          POSTGRES_DB: upstream
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U upstream" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://upstream:upstream@localhost:5432/upstream
      # The health zone is a separate database with its own role (GC-7). CI runs
      # its boundary tests for real rather than skipping them: "no patient
      # column, no environmental credential, no small count" is a claim this
      # project makes, so it is checked on every push.
      CLINICAL_DATABASE_URL: postgresql://clinical_role:clinical@localhost:5432/clinical
      # GC-10 is tested from the kernel's own credential; without it those tests skip.
      KERNEL_DATABASE_URL: postgresql://kernel_role:kernel@localhost:5432/upstream
      CATCHMENT_ID: delhi-barapullah
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen

      # The GitHub service container starts from a bare image, so the
      # docker/postgres/init scripts never run. Apply the same file here.
      - name: Bootstrap database extensions and roles
        env:
          PGPASSWORD: upstream
        run: |
          psql -h localhost -U upstream -d upstream -v ON_ERROR_STOP=1 \
            -f docker/postgres/init/00-extensions.sql
          # That file creates the roles with a placeholder password;
          # docker/postgres/init/01-rotate-passwords.sh does this part at
          # container start, and there is no container here.
          psql -h localhost -U upstream -d upstream -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE clinical_role WITH PASSWORD 'clinical';"

      - run: uv run ruff check .
      - run: uv run alembic -c db/alembic.ini upgrade head
      # Migration 0001 creates kernel_role without a login; the container's
      # 01-rotate-passwords.sh gives it one, and there is no container here.
      - name: Give kernel_role a login
        env:
          PGPASSWORD: upstream
        run: >
          psql -h localhost -U upstream -d upstream -v ON_ERROR_STOP=1
          -c "ALTER ROLE kernel_role WITH LOGIN PASSWORD 'kernel';"
          -c "GRANT CONNECT ON DATABASE upstream TO kernel_role;"
      - run: uv run alembic -c db/alembic_clinical.ini upgrade head

      # data/artifacts is git-ignored (the network is rebuildable, GC-6), so a fresh
      # checkout has nothing for the API tests to snap observations against. Compile a
      # deterministic synthetic catchment rather than calling Overpass from CI.
      # Loaded into PostGIS, not just saved as .npz: /network/geojson serves the
      # database, so a CI that only writes the artefact tests an empty map.
      - name: Compile a synthetic network and its physics tables
        run: |
          uv run python -m upstream_kernel.compile.cli --synthetic line
          uv run python -m upstream_kernel.physics.cli

      - run: uv run pytest -q

  # GC-3: zero validator errors against the OneAquaHealth IG. This job is the
  # gate Track 7 of the submission depends on, so it fails the build on any
  # error and uploads the report either way.
  fhir:
    runs-on: ubuntu-latest
    env:
      OAH_IG_VERSION: 0.1.0-ci-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: npm install -g fsh-sushi@3

      # Cache the validator jar (~200 MB) and the FHIR package cache. Cold, the
      # validator spends about seven minutes downloading core packages before
      # it validates anything.
      - uses: actions/cache@v4
        with:
          path: |
            fhir/.validator
            ~/.fhir/packages
          key: fhir-tools-${{ hashFiles('fhir/sushi-config.yaml', 'fhir/vendor/hl7.eu.fhir.oah.tgz') }}
          restore-keys: fhir-tools-

      - name: The vendored OAH IG resolves
        run: ./fhir/tests/test_ig_resolves.sh

      - name: Zero validator errors (GC-3)
        run: ./fhir/scripts/validate.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: validation-report, path: fhir/validation-report.json }

  # Phase 10: the web app. Unit tests include the axe checks (GC-14) on the console,
  # mission and public-health components; the typecheck runs against the client
  # generated from the API's own OpenAPI schema, so a renamed field fails here. The
  # Playwright e2e suite needs a running stack and a demo incident, so it runs locally
  # (`make web-e2e`), not in CI.
  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # FR-44 / FR-45: the benchmark runs on every change and blocks one that degrades
  # calibration. It runs on the real catchment (bench/fixtures holds the compiled
  # network) with tables built from the kernel's current parameters, and is judged
  # against bench/results/summary-ci.json -- the same 40 scenarios, same seed. No
  # database: the benchmark calls the kernel in-process.
  bench:
    runs-on: ubuntu-latest
    needs: python
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run pytest -q services/bench/tests
      - name: Benchmark gate (FR-45)
        run: >
          uv run python -m upstream_bench.runner --scenarios 40 --null-days 30
          --network bench/fixtures/network.npz --tables none
          --out bench/ci-results --gate --baseline-summary bench/results/summary-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench, path: bench/ci-results }
