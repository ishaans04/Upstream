[project]
name = "upstream-shared"
version = "0.1.0"
description = "Shared Pydantic schemas and code constants. No I/O, no DB."
requires-python = "==3.12.*"
dependencies = ["pydantic==2.9.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upstream_shared"]
